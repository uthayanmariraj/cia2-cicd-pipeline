# EKS cluster, created with: eksctl create cluster -f infra/cluster.yaml
# No Kubernetes version is set, so eksctl picks its current default (a standard-support version).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: cia-devops
  region: ap-south-1

accessConfig:
  authenticationMode: API_AND_CONFIG_MAP

vpc:
  nat:
    gateway: Disable   # nodes use public subnets, which avoids the NAT gateway cost

managedNodeGroups:
  - name: workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
    privateNetworking: false
