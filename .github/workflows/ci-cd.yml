name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployments to the cluster run one at a time, in order.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP: cia-devops-rg
  AKS_CLUSTER: cia-devops
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/devops-app:${{ github.sha }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile and package with Maven
        run: mvn -B -DskipTests clean package

      - name: Run automated tests
        run: mvn -B test

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Keep the tested jar for the image build
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/devops-app.jar
          if-no-files-found: error

  publish-image:
    name: Build and push Docker image
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job sign in to Azure with OIDC, so no stored passwords
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Fetch the tested jar
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and tag the Docker image
        run: docker build -t "$IMAGE" .

      - name: Push the image to Azure Container Registry
        run: docker push "$IMAGE"

  deploy:
    name: Deploy to AKS and verify
    needs: publish-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: v0.2.22

      - name: Connect kubectl to the cluster
        run: |
          az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Install Ansible
        run: pipx install --include-deps ansible && pipx inject ansible kubernetes

      - name: Deploy or update the Kubernetes application
        working-directory: ansible
        run: ansible-playbook -i inventory.ini deploy.yml -e "image=$IMAGE" -e "version=$GITHUB_SHA"

      - name: Verify deployment status and application availability
        working-directory: ansible
        run: ansible-playbook -i inventory.ini verify.yml -e "version=$GITHUB_SHA"
