name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployments to the cluster run one at a time, in order.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: cia-devops
  AWS_ROLE: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/cia-devops-github-actions
  IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/devops-app:${{ github.sha }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile and package with Maven
        run: mvn -B -DskipTests clean package

      - name: Run automated tests
        run: mvn -B test

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Keep the tested jar for the image build
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/devops-app.jar
          if-no-files-found: error

  publish-image:
    name: Build and push Docker image
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets the job sign in to AWS with OIDC, so no stored AWS keys
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Fetch the tested jar
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag the Docker image
        run: docker build -t "$IMAGE" .

      - name: Push the image to Amazon ECR
        run: docker push "$IMAGE"

  deploy:
    name: Deploy to EKS and verify
    needs: publish-image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect kubectl to the cluster
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Install Ansible
        run: pipx install --include-deps ansible && pipx inject ansible kubernetes

      - name: Deploy or update the Kubernetes application
        working-directory: ansible
        run: ansible-playbook -i inventory.ini deploy.yml -e "image=$IMAGE" -e "version=$GITHUB_SHA"

      - name: Verify deployment status and application availability
        working-directory: ansible
        run: ansible-playbook -i inventory.ini verify.yml -e "version=$GITHUB_SHA"
