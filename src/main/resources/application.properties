spring.application.name=devops-app
server.port=8080
server.shutdown=graceful

# Shown on the home page. Edit app.message to demonstrate a change going through the pipeline.
app.message=Welcome to the CI/CD demo application
# The pipeline sets APP_VERSION to the Git commit of the image being deployed.
app.version=${APP_VERSION:local}

# Kubernetes probes call these (liveness and readiness groups).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
