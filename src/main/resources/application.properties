spring.application.name=devops-app
server.port=8080
server.shutdown=graceful

# Shown on the home page. Edit app.message to demonstrate a change going through the pipeline.
app.message=Version 4: results are saved on a persistent volume
# The pipeline sets APP_VERSION to the Git commit of the image being deployed.
app.version=${APP_VERSION:local}

# Where saved results are written. In Kubernetes, DATA_DIR is the PersistentVolumeClaim mount.
app.data-dir=${DATA_DIR:${java.io.tmpdir}/devops-app-data}
# Oldest results are removed beyond this many, so the volume cannot fill up.
app.max-records=200

# Browsers must check for a newer page on every visit, so a redeploy shows up straight away.
spring.web.resources.cache.cachecontrol.no-cache=true

# Kubernetes probes call these (liveness and readiness groups).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
